[project]
name = "agentic-lab-agents"
version = "0.1.0"
description = "Agentic Lab agents: ADK orchestrator + A2A research/analysis agents"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "ag-ui-adk>=0.7.0",
    # a2a-sdk 1.x: protobuf-based AgentCard/AgentSkill (snake_case fields),
    # manual FastAPI route wiring via a2a.server.routes instead of
    # A2AStarletteApplication. The [fastapi] extra pulls in what
    # add_a2a_routes_to_fastapi needs. research_agent.py/analysis_agent.py
    # enable v0.3 JSON-RPC wire compatibility so the JS `@a2a-js/sdk` client
    # (used by runtime/server.mjs, which still speaks the older wire format)
    # keeps working unchanged.
    "a2a-sdk[fastapi]>=1.1.2,<2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.40.0",
]
